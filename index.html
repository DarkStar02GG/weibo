<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📢 随便说两句</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .publish-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
        }
        textarea {
            width: 100%;
            border: none;
            background: transparent;
            resize: vertical;
            font-size: 16px;
            padding: 8px 0;
            outline: none;
            color: #1a1a2e;
            min-height: 60px;
        }
        textarea::placeholder {
            color: #a0a0b8;
        }
        .publish-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .publish-actions .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .file-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #6c6c8a;
            font-size: 14px;
            padding: 6px 14px;
            border-radius: 30px;
            background: #f0f2f6;
            transition: 0.2s;
        }
        .file-label:hover {
            background: #e4e7ed;
        }
        .file-label svg {
            width: 18px;
            height: 18px;
        }
        #imageInput {
            display: none;
        }
        .image-preview {
            margin-top: 10px;
            display: none;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            border: 1px solid #e4e7ed;
        }
        .btn-publish {
            background: #1a1a2e;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-publish:hover {
            background: #2d2d44;
            transform: scale(1.02);
        }
        .btn-publish:active {
            transform: scale(0.96);
        }
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .post-card {
            background: white;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef1f5;
            transition: 0.2s;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .post-content {
            font-size: 16px;
            line-height: 1.6;
            color: #1a1a2e;
            margin-bottom: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .post-image {
            margin: 10px 0 12px;
        }
        .post-image img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid #eef1f5;
        }
        .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #8e8ea8;
            flex-wrap: wrap;
        }
        .post-meta .ip {
            background: #f0f2f6;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 12px;
            color: #6c6c8a;
        }
        .post-meta .time {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .loading {
            text-align: center;
            color: #8e8ea8;
            padding: 30px 0;
            font-size: 14px;
        }
        .empty {
            text-align: center;
            color: #b0b0c8;
            padding: 40px 0;
            font-size: 15px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1;
        }
        @media (max-width: 480px) {
            .container {
                padding: 0 4px;
            }
            .publish-card {
                padding: 16px;
            }
            .post-card {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📢 随便说两句</h1>

        <!-- 发布区 -->
        <div class="publish-card">
            <textarea id="content" placeholder="写点啥...（支持文字 + 图片）"></textarea>

            <div class="image-preview" id="imagePreview">
                <img id="previewImg" src="" alt="预览">
            </div>

            <div class="publish-actions">
                <div class="left">
                    <label class="file-label" for="imageInput">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        选图
                    </label>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                <button class="btn-publish" onclick="publish()">
                    <span>✏️</span> 发布
                </button>
            </div>
        </div>

        <!-- 帖子列表 -->
        <div id="postList" class="post-list">
            <div class="loading">⏳ 加载中...</div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script>
        // ===== 配置 =====
        const SUPABASE_URL = 'https://purzfmkvlebwfocjinaj.supabase.co'
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1cnpmbWt2bGVid2ZvY2ppbmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MTE5NDAsImV4cCI6MjEwMDQ4Nzk0MH0.l9Os0mlhIM9ObZtWEkG0BT0YYouGgLS8x1cCzl_rATA'
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

        // ===== 图片预览 =====
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0]
            const preview = document.getElementById('imagePreview')
            const img = document.getElementById('previewImg')
            if (file) {
                const reader = new FileReader()
                reader.onload = function(ev) {
                    img.src = ev.target.result
                    preview.style.display = 'block'
                }
                reader.readAsDataURL(file)
            } else {
                preview.style.display = 'none'
            }
        })

        // ===== 发布 =====
        async function publish() {
            const text = document.getElementById('content').value.trim()
            const file = document.getElementById('imageInput').files[0]
            if (!text && !file) {
                showToast('写点内容或选张图吧 😅')
                return
            }

            try {
                // 获取 IP
                const ipRes = await fetch('https://api.ipify.org?format=json')
                const { ip } = await ipRes.json()

                let imageUrl = ''

                // 上传图片
                if (file) {
                    const fileName = Date.now() + '_' + file.name.replace(/\s/g, '_')
                    const { data, error } = await supabase.storage.from('images').upload(fileName, file)
                    if (error) {
                        showToast('图片上传失败: ' + error.message)
                        return
                    }
                    imageUrl = SUPABASE_URL + '/storage/v1/object/public/images/' + fileName
                }

                // 存入数据库
                const { error } = await supabase.from('posts').insert({
                    content: text || '',
                    image_url: imageUrl,
                    ip_address: ip
                })

                if (error) {
                    showToast('发布失败: ' + error.message)
                    return
                }

                // 清空输入
                document.getElementById('content').value = ''
                document.getElementById('imageInput').value = ''
                document.getElementById('imagePreview').style.display = 'none'
                showToast('✅ 发布成功！')
                loadPosts()

            } catch (err) {
                showToast('出错了: ' + err.message)
            }
        }

        // ===== 加载帖子 =====
        async function loadPosts() {
            const list = document.getElementById('postList')
            list.innerHTML = '<div class="loading">⏳ 加载中...</div>'

            try {
                const { data, error } = await supabase
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false })

                if (error) {
                    list.innerHTML = '<div class="empty">加载失败，请刷新重试</div>'
                    return
                }

                if (!data || data.length === 0) {
                    list.innerHTML = '<div class="empty">📭 还没有帖子，快来发第一条！</div>'
                    return
                }

                list.innerHTML = data.map(post => {
                    const time = new Date(post.created_at)
                    const timeStr =
                        `${time.getFullYear()}年${String(time.getMonth()+1).padStart(2,'0')}月${String(time.getDate()).padStart(2,'0')}日 ${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}:${String(time.getSeconds()).padStart(2,'0')}`
                    return `
                        <div class="post-card">
                            <div class="post-content">${post.content || ''}</div>
                            ${post.image_url ? `<div class="post-image"><img src="${post.image_url}" alt="图片" onerror="this.style.display='none'"></div>` : ''}
                            <div class="post-meta">
                                <span class="time">🕒 ${timeStr}</span>
                                <span class="ip">📍 ${post.ip_address || '未知'}</span>
                            </div>
                        </div>
                    `
                }).join('')

            } catch (err) {
                list.innerHTML = '<div class="empty">出错了，请刷新重试</div>'
            }
        }

        // ===== Toast 提示 =====
        function showToast(msg) {
            const el = document.getElementById('toast')
            el.textContent = msg
            el.classList.add('show')
            clearTimeout(el._timer)
            el._timer = setTimeout(() => el.classList.remove('show'), 2500)
        }

        // ===== 自动刷新（每10秒） =====
        loadPosts()
        setInterval(loadPosts, 10000)
    </script>

</body>
</html>
