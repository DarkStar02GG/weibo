<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📁 我的文件</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f1a2e;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 2rem 1.5rem;
            color: #e8edf5;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 960px; margin: 0 auto; }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-bar .logo {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-bar .logo i { color: #ffd93d; }
        .nav-bar .path {
            font-size: 0.85rem;
            color: #6a8aaa;
            background: rgba(255,255,255,0.05);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .file-card {
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 2rem 1.2rem 1.5rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.2s ease;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            touch-action: manipulation;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .file-card:active {
            transform: scale(0.94);
            background: rgba(255,255,255,0.1);
        }
        .file-card .icon {
            font-size: 3.6rem;
            margin-bottom: 0.6rem;
            display: block;
            line-height: 1.2;
        }
        .file-card .name {
            font-size: 1rem;
            font-weight: 500;
            color: #d6e2f0;
        }
        .file-card .meta {
            font-size: 0.75rem;
            color: #5a7a9f;
            margin-top: 4px;
        }
        .file-card .type-tag {
            display: inline-block;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255,255,255,0.06);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            color: #7a9bcb;
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        /* 各类型配色 */
        .file-card.video .icon { color: #ff6b6b; }
        .file-card.video .type-tag { color: #ff6b6b; border-color: rgba(255,107,107,0.2); }

        .file-card.ppt .icon { color: #ff9f43; }
        .file-card.ppt .type-tag { color: #ff9f43; border-color: rgba(255,159,67,0.2); }

        .file-card.image .icon { color: #4ecdc4; }
        .file-card.image .type-tag { color: #4ecdc4; border-color: rgba(78,205,196,0.2); }

        .footer-info {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #3a5a7a;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 1.5rem;
        }

        @media (max-width: 480px) {
            body { padding: 1rem; }
            .file-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1rem;
            }
            .file-card { padding: 1.5rem 0.8rem 1.2rem; }
            .file-card .icon { font-size: 2.8rem; }
            .file-card .name { font-size: 0.85rem; }
            .nav-bar .path { font-size: 0.65rem; padding: 0.2rem 0.6rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 顶部导航 -->
    <div class="nav-bar">
        <span class="logo"><i class="fas fa-folder-open"></i> 我的文件</span>
        <span class="path"><i class="fas fa-folder"></i> 根目录</span>
    </div>

    <!-- 文件网格：三张卡片 -->
    <div class="file-grid">
        <!-- 1. 视频 -->
        <a href="video.html" class="file-card video">
            <span class="icon">🎬</span>
            <div class="name">精彩视频</div>
            <div class="meta">83.4 MB · MP4</div>
            <span class="type-tag">视频</span>
        </a>

        <!-- 2. PPT -->
        <a href="ppt.html" class="file-card ppt">
            <span class="icon">📊</span>
            <div class="name">演示文稿</div>
            <div class="meta">28 页 · PDF</div>
            <span class="type-tag">PPT</span>
        </a>

        <!-- 3. 图片库 -->
        <a href="picture.html" class="file-card image">
            <span class="icon">🖼️</span>
            <div class="name">图片库</div>
            <div class="meta">ZIP 图包</div>
            <span class="type-tag">图片</span>
        </a>
    </div>

    <div class="footer-info">
        <i class="fas fa-database"></i> 共 3 个文件 · 点击即可打开
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
</html>
