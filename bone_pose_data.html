<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLB导入 + 动画控制</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* ===== 导入面板 ===== */
        #import-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 13, 26, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 30px;
            gap: 20px;
            transition: opacity 0.5s;
        }
        #import-panel.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #import-panel h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        #import-panel p {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            text-align: center;
            max-width: 300px;
        }
        #file-input-wrap {
            position: relative;
            background: rgba(255,255,255,0.06);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 40px 50px;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
        }
        #file-input-wrap:active {
            transform: scale(0.96);
            border-color: #ffaa33;
        }
        #file-input-wrap input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            touch-action: manipulation;
        }
        #file-input-wrap .icon {
            font-size: 48px;
            display: block;
            text-align: center;
            margin-bottom: 10px;
        }
        #file-input-wrap .label {
            color: #fff;
            font-size: 16px;
        }
        #file-input-wrap .sub {
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 6px;
        }

        #file-name {
            color: #88ddff;
            font-size: 14px;
            background: rgba(255,255,255,0.05);
            padding: 8px 18px;
            border-radius: 30px;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== 顶部状态 ===== */
        #top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            padding: 12px 16px;
            padding-top: env(safe-area-inset-top);
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        #top-bar > * { pointer-events: auto; }
        #status-badge {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.06);
            color: #88ddff;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #66ff88;
            transition: 0.2s;
        }
        #status-badge .dot.paused { background: #ff8866; }
        #reload-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            touch-action: manipulation;
            border: 1px solid rgba(255,255,255,0.05);
        }
        #reload-btn:active { transform: scale(0.94); }

        /* ===== 底部控制 ===== */
        #bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            padding: 0 16px 30px;
            padding-bottom: env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
        }
        #bottom-controls > * { pointer-events: auto; }
        #action-btn {
            background: rgba(255, 170, 51, 0.9);
            border: none;
            color: #0d0d1a;
            font-size: 17px;
            font-weight: 600;
            padding: 14px 40px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(255,170,51,0.2);
            touch-action: manipulation;
            min-width: 160px;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #action-btn:active { transform: scale(0.94); }
        #action-btn:disabled {
            opacity: 0.4;
            transform: none;
        }
        #hint {
            color: rgba(255,255,255,0.2);
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        /* ===== 加载遮罩 ===== */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13,13,26,0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 150;
            color: #fff;
            gap: 16px;
        }
        #loading.show { display: flex; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #ffaa33;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            #import-panel h1 { font-size: 20px; }
            #file-input-wrap { padding: 30px 30px; }
            #file-input-wrap .icon { font-size: 36px; }
            #action-btn { padding: 12px 28px; font-size: 15px; min-width: 130px; }
        }
    </style>
</head>
<body>

    <!-- ===== 导入面板 ===== -->
    <div id="import-panel">
        <h1>📦 导入 GLB</h1>
        <p>选择您设备中的 .glb 或 .gltf 文件</p>
        <div id="file-input-wrap">
            <input type="file" id="fileInput" accept=".glb,.gltf" />
            <span class="icon">📁</span>
            <div class="label">点击选择文件</div>
            <div class="sub">.glb 或 .gltf</div>
        </div>
        <div id="file-name"></div>
    </div>

    <!-- ===== 加载中 ===== -->
    <div id="loading">
        <div class="spinner"></div>
        <div id="load-text">加载模型中...</div>
    </div>

    <!-- ===== 顶部栏 ===== -->
    <div id="top-bar" style="display:none;">
        <div id="status-badge">
            <span class="dot" id="statusDot"></span>
            <span id="statusLabel">播放中</span>
        </div>
        <button id="reload-btn">🔄 换模型</button>
    </div>

    <!-- ===== 底部控制 ===== -->
    <div id="bottom-controls" style="display:none;">
        <button id="action-btn">
            <span id="btnIcon">⏸</span>
            <span id="btnLabel">暂停</span>
        </button>
        <div id="hint">👆 点击按钮 · 拖动旋转 · 双指缩放</div>
    </div>

    <!-- ===== Three.js ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- DOM ---
        const importPanel = document.getElementById('import-panel');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('file-name');
        const loadingEl = document.getElementById('loading');
        const loadText = document.getElementById('load-text');
        const topBar = document.getElementById('top-bar');
        const bottomControls = document.getElementById('bottom-controls');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const actionBtn = document.getElementById('action-btn');
        const btnIcon = document.getElementById('btnIcon');
        const btnLabel = document.getElementById('btnLabel');
        const reloadBtn = document.getElementById('reload-btn');

        // --- Three.js 场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d1a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(3.5, 2.8, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.prepend(renderer.domElement);

        // --- 控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 1.5;
        controls.maxDistance = 15;
        controls.target.set(0, 0.7, 0);
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 0.6;

        // --- 灯光 ---
        scene.add(new THREE.AmbientLight(0x40406b, 0.8));
        const key = new THREE.DirectionalLight(0xffeedd, 2.8);
        key.position.set(4, 6, 3);
        key.castShadow = true;
        key.shadow.mapSize.width = 1024;
        key.shadow.mapSize.height = 1024;
        scene.add(key);
        const fill = new THREE.DirectionalLight(0x4488ff, 0.9);
        fill.position.set(-3, 2, -4);
        scene.add(fill);
        const rim = new THREE.DirectionalLight(0xffdd99, 0.5);
        rim.position.set(-1, 0.5, 5);
        scene.add(rim);
        scene.add(new THREE.PointLight(0x3366ff, 0.3, 8));

        // --- 地面 ---
        const grid = new THREE.GridHelper(6, 10, 0x88aaff, 0x334466);
        grid.position.y = -0.01;
        scene.add(grid);
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(6, 6),
            new THREE.ShadowMaterial({ opacity: 0.25 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- 状态 ---
        let mixer = null;
        let action = null;
        let isPlaying = true;
        let modelRoot = null;
        let modelLoaded = false;

        function updateUI() {
            if (!modelLoaded) return;
            if (isPlaying) {
                statusDot.className = 'dot';
                statusLabel.textContent = '播放中';
                btnIcon.textContent = '⏸';
                btnLabel.textContent = '暂停';
            } else {
                statusDot.className = 'dot paused';
                statusLabel.textContent = '已暂停';
                btnIcon.textContent = '▶';
                btnLabel.textContent = '播放';
            }
        }

        function togglePlay() {
            if (!mixer || !action || !modelLoaded) return;
            if (isPlaying) {
                action.paused = true;
                isPlaying = false;
            } else {
                action.paused = false;
                isPlaying = true;
            }
            updateUI();
        }

        // --- 清空场景中的旧模型 ---
        function clearModel() {
            if (modelRoot) {
                scene.remove(modelRoot);
                // 清理几何体和材质释放 (简化)
                modelRoot.traverse((node) => {
                    if (node.isMesh) {
                        node.geometry?.dispose();
                        if (Array.isArray(node.material)) {
                            node.material.forEach(m => m.dispose());
                        } else {
                            node.material?.dispose();
                        }
                    }
                });
                modelRoot = null;
            }
            if (mixer) {
                mixer.stopAllAction();
                mixer = null;
                action = null;
            }
            modelLoaded = false;
            isPlaying = true;
        }

        // --- 加载 GLB 文件 (从 File 对象) ---
        function loadGLBFile(file) {
            clearModel();
            loadingEl.classList.add('show');
            loadText.textContent = '解析模型中...';

            const reader = new FileReader();
            reader.onload = (e) => {
                const arrayBuffer = e.target.result;
                const loader = new GLTFLoader();
                loader.parse(
                    arrayBuffer,
                    '',
                    (gltf) => {
                        const root = gltf.scene;
                        // 自动适配大小：计算包围盒
                        const box = new THREE.Box3().setFromObject(root);
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        let scale = 1;
                        if (maxDim > 0) {
                            scale = 2.5 / maxDim; // 让模型大小适中
                        }
                        root.scale.set(scale, scale, scale);
                        // 居中
                        const center = box.getCenter(new THREE.Vector3());
                        root.position.sub(center.multiplyScalar(scale));
                        root.position.y += 0.1;

                        root.traverse((node) => {
                            if (node.isMesh) {
                                node.castShadow = true;
                                node.receiveShadow = true;
                            }
                        });

                        scene.add(root);
                        modelRoot = root;

                        // --- 动画 ---
                        if (gltf.animations && gltf.animations.length > 0) {
                            mixer = new THREE.AnimationMixer(root);
                            const clip = gltf.animations[0];
                            action = mixer.clipAction(clip);
                            action.play();
                            isPlaying = true;
                            modelLoaded = true;
                            updateUI();
                            console.log(`✅ 动画已加载 (${gltf.animations.length} 个)`);
                        } else {
                            modelLoaded = true;
                            statusDot.className = 'dot paused';
                            statusLabel.textContent = '无动画';
                            btnIcon.textContent = '⛔';
                            btnLabel.textContent = '无动画';
                            actionBtn.disabled = true;
                            actionBtn.style.opacity = '0.5';
                        }

                        loadingEl.classList.remove('show');
                        importPanel.classList.add('hidden');
                        topBar.style.display = 'flex';
                        bottomControls.style.display = 'flex';
                        fileName.textContent = `✅ ${file.name}`;
                    },
                    (err) => {
                        console.error('解析失败:', err);
                        loadText.textContent = '❌ 解析失败，请检查文件';
                        setTimeout(() => loadingEl.classList.remove('show'), 1500);
                    }
                );
            };
            reader.onerror = () => {
                loadText.textContent = '❌ 读取文件失败';
                setTimeout(() => loadingEl.classList.remove('show'), 1500);
            };
            reader.readAsArrayBuffer(file);
        }

        // --- 文件选择 ---
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'glb' && ext !== 'gltf') {
                alert('请选择 .glb 或 .gltf 文件');
                fileInput.value = '';
                return;
            }
            fileName.textContent = `📄 ${file.name}`;
            loadGLBFile(file);
        });

        // --- 按钮事件 ---
        actionBtn.addEventListener('click', togglePlay);

        reloadBtn.addEventListener('click', () => {
            clearModel();
            importPanel.classList.remove('hidden');
            topBar.style.display = 'none';
            bottomControls.style.display = 'none';
            fileInput.value = '';
            fileName.textContent = '';
            actionBtn.disabled = false;
            actionBtn.style.opacity = '1';
            statusDot.className = 'dot';
            statusLabel.textContent = '待加载';
            btnIcon.textContent = '⏸';
            btnLabel.textContent = '暂停';
        });

        // 键盘空格支持
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (modelLoaded) togglePlay();
            }
        });

        // 防止滚动
        window.addEventListener('touchmove', (e) => {
            if (e.target === renderer.domElement) e.preventDefault();
        }, { passive: false });

        // --- 窗口自适应 ---
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // --- 渲染循环 ---
        const clock = new THREE.Clock();
        function animate() {
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        console.log('📱 请点击上方区域选择 .glb 文件导入');
    </script>
</body>
</html>
