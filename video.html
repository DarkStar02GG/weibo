<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎬 视频</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f1a2e;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            color: #e8edf5;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.2rem;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-wrap: wrap;
            gap: 8px;
        }
        .nav-bar .back-link {
            color: #8ba0c9;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 40px;
            transition: 0.2s;
            cursor: pointer;
        }
        .nav-bar .back-link:active { background: rgba(255,255,255,0.08); }
        .nav-bar .title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-bar .title i { color: #ff6b6b; }
        .nav-bar .info {
            font-size: 0.8rem;
            color: #5a7a9f;
        }

        #listMode { padding: 1.5rem; max-width: 1000px; margin: 0 auto; }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.2rem;
        }
        .video-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.2s ease;
            cursor: pointer;
            touch-action: manipulation;
        }
        .video-card:active {
            transform: scale(0.96);
            background: rgba(255,255,255,0.08);
        }
        .video-card .thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: #ff6b6b;
            position: relative;
        }
        .video-card .thumb .play-icon {
            position: absolute;
            font-size: 2.8rem;
            color: rgba(255,255,255,0.7);
            text-shadow: 0 2px 20px rgba(0,0,0,0.6);
        }
        .video-card .info { padding: 0.7rem 0.9rem 0.9rem; }
        .video-card .info .name {
            font-weight: 500;
            font-size: 0.85rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #c8d6e5;
        }
        .video-card .info .meta {
            font-size: 0.6rem;
            color: #5a7a9f;
        }
        .empty-hint {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: #4a6a8f;
        }
        .empty-hint i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.8rem;
            opacity: 0.4;
        }

        #playerMode {
            display: none;
            max-width: 880px;
            margin: 0 auto;
            padding: 1rem 1.2rem 1.8rem;
        }
        #playerMode.active { display: block; }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
        }
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
            background: #0a0a0a;
            display: block;
        }
        .btn-turbo {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 20;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
        }
        .btn-turbo:active { transform: scale(0.92); }
        .btn-turbo.active {
            background: rgba(255,215,0,0.25);
            border-color: #ffd93d;
            color: #ffd93d;
        }
        .btn-turbo .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4a6a8f;
            transition: 0.2s;
            display: inline-block;
        }
        .btn-turbo.active .dot { background: #ffd93d; box-shadow: 0 0 12px #ffd93d; }
        .btn-turbo .sub { font-size: 0.45rem; font-weight: 400; opacity: 0.5; }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.8rem;
            color: #c8d6e5;
            flex-wrap: wrap;
            gap: 6px;
        }
        .player-info .name { font-size: 0.9rem; font-weight: 500; }
        .player-info .badge {
            background: rgba(255,255,255,0.06);
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            font-size: 0.65rem;
            color: #8ba0c9;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 0.6rem;
            padding: 0.3rem 0.6rem;
            background: rgba(255,255,255,0.03);
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.05);
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls-bar label {
            color: #8ba0c9;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .controls-bar select {
            background: rgba(255,255,255,0.08);
            color: #e8edf5;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 0.15rem 0.7rem;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }
        .controls-bar select option { background: #1a2639; color: #e8edf5; }
        .speed-display {
            color: #ffd93d;
            font-weight: 500;
            min-width: 36px;
            text-align: center;
            font-size: 0.85rem;
        }
        .status {
            text-align: center;
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: #5a7a9f;
        }
        .status .ok { color: #51cf66; }
        .status .err { color: #ff6b6b; }

        @media (max-width: 480px) {
            #listMode { padding: 0.8rem; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.8rem; }
            .video-card .info { padding: 0.4rem 0.6rem 0.6rem; }
            .video-card .info .name { font-size: 0.75rem; }
            #playerMode { padding: 0.5rem 0.8rem 1.2rem; }
            .btn-turbo { top: 10px; left: 10px; padding: 4px 10px; font-size: 0.85rem; }
            .controls-bar { gap: 6px; padding: 0.2rem 0.4rem; }
        }
    </style>
</head>
<body>

<div class="nav-bar">
    <span class="back-link" id="navBack"><i class="fas fa-arrow-left"></i> <span id="navBackText">返回</span></span>
    <span class="title"><i class="fas fa-video"></i> <span id="navTitle">视频列表</span></span>
    <span class="info" id="navInfo">加载中...</span>
</div>

<!-- ===== 列表模式 ===== -->
<div id="listMode">
    <div class="video-grid" id="videoGrid">
        <div class="empty-hint"><i class="fas fa-video"></i> 暂无视频</div>
    </div>
</div>

<!-- ===== 播放器模式 ===== -->
<div id="playerMode">
    <div class="video-wrapper">
        <video id="videoPlayer" controls playsinline preload="metadata">
            <source id="videoSource" src="" type="video/mp4">
            您的浏览器不支持视频播放。
        </video>
        <button class="btn-turbo" id="turboBtn"><span class="dot"></span> 3× <span class="sub">Turbo</span></button>
    </div>
    <div class="player-info">
        <span class="name" id="playerName">视频</span>
        <span class="badge" id="playerBadge">MP4</span>
    </div>
    <div class="controls-bar">
        <label><i class="fas fa-gauge-high"></i> 倍速</label>
        <select id="speedSelect">
            <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option><option value="1.0" selected>1.0×</option>
            <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option><option value="2.0">2.0×</option>
            <option value="2.5">2.5×</option><option value="3.0">3.0×</option>
        </select>
        <span class="speed-display" id="speedDisplay">1.0×</span>
    </div>
    <div class="status" id="statusMsg"><i class="fas fa-check-circle ok"></i> 点击 3× 切换加速</div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script>
(function() {
    // ============================================================
    // 📋 视频URL大数组（直接填直链，自动编号）
    // ============================================================
    var videoList = [
        'https://lz0.qaiu.top/d/lz/
iE6F6419hzob@bb',
        'https://lz0.qaiu.top/d/lz/idSt841dzloj@oo',
'https://lz0.qaiu.top/d/lz/i9PaH41e6k9a@dsjs',
'https://lz0.qaiu.top/d/lz/ife4H41gjwng@h36k'
    ];
    // ============================================================

    var listMode = document.getElementById('listMode');
    var playerMode = document.getElementById('playerMode');
    var videoGrid = document.getElementById('videoGrid');
    var navBack = document.getElementById('navBack');
    var navBackText = document.getElementById('navBackText');
    var navTitle = document.getElementById('navTitle');
    var navInfo = document.getElementById('navInfo');

    var video = document.getElementById('videoPlayer');
    var source = document.getElementById('videoSource');
    var playerName = document.getElementById('playerName');
    var playerBadge = document.getElementById('playerBadge');
    var statusMsg = document.getElementById('statusMsg');
    var turboBtn = document.getElementById('turboBtn');
    var speedSelect = document.getElementById('speedSelect');
    var speedDisplay = document.getElementById('speedDisplay');

    var currentIndex = -1;
    var isTurboActive = false;

    // ============================================================
    // 1. 渲染列表
    // ============================================================
    function renderList() {
        if (videoList.length === 0) {
            videoGrid.innerHTML = `<div class="empty-hint"><i class="fas fa-video"></i> 暂无视频</div>`;
            navInfo.textContent = '0 个视频';
            return;
        }
        navInfo.textContent = videoList.length + ' 个视频';
        var html = '';
        videoList.forEach(function(url, index) {
            var num = index + 1;
            html += `
                <div class="video-card" data-index="${index}">
                    <div class="thumb">
                        <span class="play-icon"><i class="fas fa-play-circle"></i></span>
                        <span style="font-size:2rem;opacity:0.2;">🎬</span>
                    </div>
                    <div class="info">
                        <div class="name">视频 ${num}</div>
                        <div class="meta">第 ${num} 个</div>
                    </div>
                </div>
            `;
        });
        videoGrid.innerHTML = html;
        document.querySelectorAll('.video-card').forEach(function(card) {
            card.addEventListener('click', function() {
                var idx = parseInt(this.dataset.index);
                playVideo(idx);
            });
        });
    }

    // ============================================================
    // 2. 播放视频
    // ============================================================
    function playVideo(index) {
        if (index < 0 || index >= videoList.length) {
            statusMsg.innerHTML = '<i class="fas fa-exclamation-circle err"></i> 视频不存在';
            return;
        }
        currentIndex = index;
        var url = videoList[index];
        source.src = url;
        video.load();
        playerName.textContent = '视频 ' + (index + 1);
        playerBadge.textContent = 'MP4';
        listMode.style.display = 'none';
        playerMode.classList.add('active');
        navBackText.textContent = '列表';
        navTitle.textContent = '🎬 播放';
        navInfo.textContent = '视频 ' + (index + 1);
        statusMsg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 加载中...';
        // 重置倍速状态
        isTurboActive = false;
        turboBtn.classList.remove('active');
        video.playbackRate = 1.0;
        speedSelect.value = '1.0';
        speedDisplay.textContent = '1.00×';
    }

    // ============================================================
    // 3. 返回逻辑
    // ============================================================
    function goToList() {
        listMode.style.display = 'block';
        playerMode.classList.remove('active');
        navBackText.textContent = '返回';
        navTitle.textContent = '📋 视频列表';
        navInfo.textContent = videoList.length + ' 个视频';
        video.pause();
    }

    navBack.addEventListener('click', function(e) {
        if (playerMode.classList.contains('active')) {
            e.preventDefault();
            goToList();
        } else {
            window.location.href = 'index.html';
        }
    });

    // ============================================================
    // 4. 倍速控制（修复版）
    // ============================================================
    function updateSpeedDisplay(r) {
        speedDisplay.textContent = r.toFixed(2) + '×';
        var opt = Array.from(speedSelect.options).find(function(o) {
            return Math.abs(parseFloat(o.value) - r) < 0.01;
        });
        if (opt) speedSelect.value = opt.value;
    }

    // 切换 3× 倍速
    function toggleTurbo() {
        if (isTurboActive) {
            // 恢复到 1×
            isTurboActive = false;
            turboBtn.classList.remove('active');
            video.playbackRate = 1.0;
            updateSpeedDisplay(1.0);
            speedSelect.value = '1.0';
        } else {
            // 切换到 3×
            isTurboActive = true;
            turboBtn.classList.add('active');
            video.playbackRate = 3.0;
            updateSpeedDisplay(3.0);
            speedSelect.value = '3.0';
        }
    }

    turboBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleTurbo();
    });

    // 下拉菜单控制倍速
    speedSelect.addEventListener('change', function() {
        var rate = parseFloat(this.value);
        video.playbackRate = rate;
        updateSpeedDisplay(rate);
        // 如果下拉选了 3×，同步按钮状态
        if (Math.abs(rate - 3.0) < 0.01) {
            isTurboActive = true;
            turboBtn.classList.add('active');
        } else {
            isTurboActive = false;
            turboBtn.classList.remove('active');
        }
    });

    // 监听视频倍速变化（键盘 K/J 等）
    video.addEventListener('ratechange', function() {
        var cur = video.playbackRate;
        updateSpeedDisplay(cur);
        // 同步下拉框
        var opt = Array.from(speedSelect.options).find(function(o) {
            return Math.abs(parseFloat(o.value) - cur) < 0.01;
        });
        if (opt) speedSelect.value = opt.value;
        // 同步按钮状态
        if (Math.abs(cur - 3.0) < 0.01) {
            isTurboActive = true;
            turboBtn.classList.add('active');
        } else {
            isTurboActive = false;
            turboBtn.classList.remove('active');
        }
    });

    // 键盘快捷键 K/J
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (e.key === 'k' || e.key === 'K') {
            e.preventDefault();
            var cur = video.playbackRate;
            var nr = Math.min(3.0, cur + 0.25);
            video.playbackRate = nr;
        }
        if (e.key === 'j' || e.key === 'J') {
            e.preventDefault();
            var cur = video.playbackRate;
            var nr = Math.max(0.25, cur - 0.25);
            video.playbackRate = nr;
        }
    });

    // ============================================================
    // 5. 视频错误处理
    // ============================================================
    video.addEventListener('error', function(e) {
        var err = video.error;
        var msg = '视频加载失败';
        if (err) {
            switch(err.code) {
                case 1: msg = '视频加载被中止'; break;
                case 2: msg = '直链已过期，请更新视频地址'; break;
                case 3: msg = '视频解码失败'; break;
                case 4: msg = '视频地址无效'; break;
            }
        }
        statusMsg.innerHTML = '<i class="fas fa-exclamation-circle err"></i> ' + msg;
    });

    video.addEventListener('canplay', function() {
        statusMsg.innerHTML = '<i class="fas fa-check-circle ok"></i> ✅ 点击 3× 切换加速';
    });

    // ============================================================
    // 6. 启动
    // ============================================================
    renderList();
})();
</script>
</body>
</html>
