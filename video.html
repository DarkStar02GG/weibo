<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 在线视频 · 3× 快捷按钮</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1424;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }
        .card {
            max-width: 880px;
            width: 100%;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2rem 1.8rem 2.2rem;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
        }
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
            background: #0a0a0a;
            display: block;
        }

        /* ===== 左上角 3× 按钮 ===== */
        .btn-turbo {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-turbo:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.4);
        }
        .btn-turbo:active {
            transform: scale(0.94);
        }
        /* 激活状态（3倍速） */
        .btn-turbo.active {
            background: rgba(255, 215, 0, 0.25);
            border-color: #ffd93d;
            color: #ffd93d;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
        }
        .btn-turbo .badge-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a6a8f;
            transition: 0.2s;
        }
        .btn-turbo.active .badge-dot {
            background: #ffd93d;
            box-shadow: 0 0 12px #ffd93d;
        }
        /* 按钮上的小标签 */
        .btn-turbo .sub-label {
            font-size: 0.55rem;
            font-weight: 400;
            opacity: 0.6;
            letter-spacing: 0.3px;
        }

        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.2rem;
            padding: 0 0.3rem;
            color: #c8d6e5;
            flex-wrap: wrap;
            gap: 10px;
        }
        .info .title {
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info .title i { color: #ff6b6b; }
        .badge {
            background: rgba(255,255,255,0.08);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #8ba0c9;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 0.8rem;
            padding: 0.5rem 0.8rem;
            background: rgba(255,255,255,0.04);
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls-bar label {
            color: #8ba0c9;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .controls-bar select {
            background: rgba(255,255,255,0.08);
            color: #e8edf5;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 30px;
            padding: 0.3rem 1rem;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
        }
        .controls-bar select:hover {
            background: rgba(255,255,255,0.14);
        }
        .controls-bar select option {
            background: #1a2639;
            color: #e8edf5;
        }
        .status {
            text-align: center;
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: #5a7a9f;
        }
        .status i { margin-right: 6px; }
        .status .ok { color: #51cf66; }
        .speed-display {
            color: #ffd93d;
            font-weight: 500;
            min-width: 44px;
            text-align: center;
        }
        .hint {
            font-size: 0.7rem;
            color: #4a6a8f;
            text-align: center;
            margin-top: 4px;
        }
        .hint i { margin-right: 4px; }
        @media (max-width: 480px) {
            .card { padding: 1rem; }
            .controls-bar { gap: 10px; }
            .btn-turbo {
                top: 12px;
                left: 12px;
                padding: 6px 14px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="video-wrapper" id="videoWrapper">
        <video id="videoPlayer" controls playsinline preload="metadata">
            <source src="https://lz0.qaiu.top/d/lz/iE6F6419hzob@bb" type="video/mp4">
            您的浏览器不支持视频播放。
        </video>

        <!-- 左上角 3× 按钮 -->
        <button class="btn-turbo" id="turboBtn">
            <span class="badge-dot"></span>
            3×
            <span class="sub-label">Turbo</span>
        </button>
    </div>

    <div class="info">
        <span class="title"><i class="fas fa-play-circle"></i> 在线视频</span>
        <span class="badge">🎥 MP4 · 83.4 MB</span>
    </div>

    <div class="controls-bar">
        <label>
            <i class="fas fa-gauge-high"></i> 倍速
        </label>
        <select id="speedSelect">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1.0" selected>1.0×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2.0">2.0×</option>
            <option value="2.5">2.5×</option>
            <option value="3.0">3.0×</option>
        </select>
        <span class="speed-display" id="speedDisplay">1.0×</span>
    </div>

    <div class="status">
        <i class="fas fa-check-circle ok"></i> 点击左上角 <strong>3×</strong> 切换加速 / 恢复
    </div>
    <div class="hint">
        <i class="fas fa-mouse-pointer"></i> 也可用下拉菜单或键盘 K/J 调节
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script>
    (function() {
        const video = document.getElementById('videoPlayer');
        const turboBtn = document.getElementById('turboBtn');
        const speedSelect = document.getElementById('speedSelect');
        const speedDisplay = document.getElementById('speedDisplay');

        // 当前基准倍速（用户通过下拉或键盘设定的速度）
        let baseRate = 1.0;
        // 是否处于 3× 加速状态（按钮激活）
        let isTurboActive = false;

        // 更新显示
        function updateSpeedDisplay(rate) {
            speedDisplay.textContent = rate.toFixed(2) + '×';
            // 同步下拉框（如果该倍速在选项中）
            const option = Array.from(speedSelect.options).find(opt => Math.abs(parseFloat(opt.value) - rate) < 0.01);
            if (option) {
                speedSelect.value = option.value;
            }
        }

        // 应用倍速到视频，并更新显示
        function applySpeed(rate) {
            video.playbackRate = rate;
            updateSpeedDisplay(rate);
        }

        // 切换到 3× 加速
        function activateTurbo() {
            isTurboActive = true;
            turboBtn.classList.add('active');
            applySpeed(3.0);
        }

        // 恢复到基准倍速（取消加速）
        function deactivateTurbo() {
            isTurboActive = false;
            turboBtn.classList.remove('active');
            applySpeed(baseRate);
        }

        // 切换 3× 状态
        function toggleTurbo() {
            if (isTurboActive) {
                deactivateTurbo();
            } else {
                // 如果视频暂停，点击按钮时自动播放？
                // 保持当前播放状态，只改速度
                activateTurbo();
            }
        }

        // ---- 按钮点击 ----
        turboBtn.addEventListener('click', function(e) {
            e.stopPropagation();  // 防止冒泡干扰
            toggleTurbo();
        });

        // ---- 下拉菜单改变基准倍速 ----
        speedSelect.addEventListener('change', function() {
            const rate = parseFloat(this.value);
            baseRate = rate;
            if (!isTurboActive) {
                applySpeed(rate);
            } else {
                // 如果 Turbo 激活中，只更新基准，不改变当前速度（仍为3x）
                // 但为了体验，如果用户下拉选了3.0，可以视为手动取消Turbo？
                // 更自然：如果下拉选了3.0且Turbo激活，保持Turbo；否则只改基准
                if (Math.abs(rate - 3.0) < 0.01) {
                    // 用户选3.0，如果Turbo未激活则激活；如果已激活则不变
                    if (!isTurboActive) {
                        activateTurbo();
                    }
                } else {
                    // 用户选非3.0，如果Turbo激活则取消，应用新速率
                    if (isTurboActive) {
                        deactivateTurbo();
                        // 但上面 deactivateTurbo 会应用 baseRate，此时 baseRate 已更新
                        // 不过 deactivateTurbo 里 applySpeed(baseRate) 会正确应用
                    } else {
                        applySpeed(rate);
                    }
                }
            }
        });

        // ---- 视频播放速率变化事件（如键盘快捷键改变） ----
        video.addEventListener('ratechange', function() {
            const current = video.playbackRate;
            // 如果按钮激活中但速率被外部改为非3.0，同步状态
            if (isTurboActive && Math.abs(current - 3.0) > 0.01) {
                // 外部改变了速度（比如键盘J/K），取消Turbo状态
                isTurboActive = false;
                turboBtn.classList.remove('active');
                baseRate = current;
                updateSpeedDisplay(current);
                const opt = Array.from(speedSelect.options).find(o => Math.abs(parseFloat(o.value) - current) < 0.01);
                if (opt) speedSelect.value = opt.value;
                return;
            }
            // 如果Turbo未激活，同步显示
            if (!isTurboActive) {
                baseRate = current;
                updateSpeedDisplay(current);
                const opt = Array.from(speedSelect.options).find(o => Math.abs(parseFloat(o.value) - current) < 0.01);
                if (opt) speedSelect.value = opt.value;
            } else {
                // Turbo激活中，显示3.0
                updateSpeedDisplay(3.0);
            }
        });

        // ---- 键盘快捷键 K / J (保留) ----
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
            if (e.key === 'k' || e.key === 'K') {
                e.preventDefault();
                // 如果 Turbo 激活，调整基准速率，但保持 3x 不变（松按钮后恢复为新基准）
                if (isTurboActive) {
                    baseRate = Math.min(3.0, baseRate + 0.25);
                } else {
                    let nr = Math.min(3.0, video.playbackRate + 0.25);
                    video.playbackRate = nr;
                    baseRate = nr;
                    const opt = Array.from(speedSelect.options).find(o => Math.abs(parseFloat(o.value) - nr) < 0.01);
                    if (opt) speedSelect.value = opt.value;
                    updateSpeedDisplay(nr);
                }
            }
            if (e.key === 'j' || e.key === 'J') {
                e.preventDefault();
                if (isTurboActive) {
                    baseRate = Math.max(0.25, baseRate - 0.25);
                } else {
                    let nr = Math.max(0.25, video.playbackRate - 0.25);
                    video.playbackRate = nr;
                    baseRate = nr;
                    const opt = Array.from(speedSelect.options).find(o => Math.abs(parseFloat(o.value) - nr) < 0.01);
                    if (opt) speedSelect.value = opt.value;
                    updateSpeedDisplay(nr);
                }
            }
        });

        // ---- 初始化 ----
        baseRate = 1.0;
        applySpeed(1.0);

        // 错误处理（直链过期提示）
        video.addEventListener('error', function(e) {
            const err = video.error;
            let msg = '视频加载失败';
            if (err) {
                switch(err.code) {
                    case 1: msg = '视频加载被中止'; break;
                    case 2: msg = '网络错误，直链可能已过期或不可用'; break;
                    case 3: msg = '视频解码失败，可能格式不支持'; break;
                    case 4: msg = '视频地址无效，请更新直链'; break;
                }
            }
            document.querySelector('.status').innerHTML = `<i class="fas fa-exclamation-circle" style="color:#ff6b6b;"></i> ${msg}`;
        });
    })();
</script>

</body>
</html>
