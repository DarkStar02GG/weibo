<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎬 视频列表</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f1a2e;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            color: #e8edf5;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 800px; margin: 0 auto; }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        .nav-bar .back-link {
            color: #8ba0c9;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 40px;
            transition: 0.2s;
            cursor: pointer;
        }
        .nav-bar .back-link:active { background: rgba(255,255,255,0.08); }
        .nav-bar .title {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-bar .title i { color: #ff6b6b; }
        .nav-bar .info {
            font-size: 0.8rem;
            color: #5a7a9f;
        }

        /* ===== 视频网格 ===== */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .video-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: 0.2s ease;
            cursor: pointer;
            touch-action: manipulation;
        }
        .video-card:active {
            transform: scale(0.96);
            background: rgba(255,255,255,0.08);
        }
        .video-card .thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #ff6b6b;
            position: relative;
        }
        .video-card .thumb .play-icon {
            position: absolute;
            font-size: 2.5rem;
            color: rgba(255,255,255,0.7);
            text-shadow: 0 2px 20px rgba(0,0,0,0.6);
        }
        .video-card .info { padding: 0.6rem 0.8rem 0.8rem; }
        .video-card .info .name {
            font-weight: 500;
            font-size: 0.85rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .video-card .info .meta {
            font-size: 0.6rem;
            color: #5a7a9f;
        }
        .empty-hint {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem 1rem;
            color: #4a6a8f;
        }

        /* ===== 输入区域 ===== */
        .input-area {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 1.2rem;
            border: 1px solid rgba(255,255,255,0.06);
            margin-top: 0.5rem;
        }
        .input-area .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-area input {
            flex: 1;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: #e8edf5;
            font-size: 0.9rem;
            outline: none;
            min-width: 200px;
        }
        .input-area input:focus { border-color: #ff6b6b; }
        .input-area input::placeholder { color: #5a7a9f; }
        .input-area button {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 12px;
            background: #ff6b6b;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .input-area button:active { transform: scale(0.94); opacity: 0.8; }
        .input-area .hint {
            font-size: 0.7rem;
            color: #5a7a9f;
            margin-top: 0.6rem;
        }
        .input-area .hint code {
            background: rgba(255,255,255,0.06);
            padding: 0.1rem 0.5rem;
            border-radius: 6px;
            font-size: 0.65rem;
            color: #8ba0c9;
            word-break: break-all;
        }

        @media (max-width: 480px) {
            body { padding: 1rem; }
            .video-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.7rem; }
            .input-area .row { flex-direction: column; }
            .input-area input { min-width: unset; }
            .input-area button { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回</a>
        <span class="title"><i class="fas fa-video"></i> 视频列表</span>
        <span class="info" id="navInfo">加载中...</span>
    </div>

    <!-- ===== 视频网格 ===== -->
    <div class="video-grid" id="videoGrid">
        <div class="empty-hint"><i class="fas fa-video"></i> 暂无视频</div>
    </div>

    <!-- ===== 输入区域 ===== -->
    <div class="input-area">
        <div class="row">
            <input type="text" id="videoUrlInput" placeholder="粘贴视频直链 或 蓝奏云链接">
            <button id="playBtn">▶ 播放</button>
        </div>
        <div class="hint">
            💡 直接粘贴 <code>https://xxx.mp4</code> 直链，或蓝奏云链接（自动解析）
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script>
(function() {
    // ============================================================
    // 📋 预设视频列表（可自由增删）
    // ============================================================
    var videoList = [
        'https://lz0.qaiu.top/d/lz/iE6F6419hzob@bb',
        'https://lz0.qaiu.top/d/lz/idSt841dzloj@oo',
        'https://lz0.qaiu.top/d/lz/i9PaH41e6k9a@dsjs',
        'https://lz0.qaiu.top/d/lz/ife4H41gjwng@h36k'
    ];
    // ============================================================

    var grid = document.getElementById('videoGrid');
    var navInfo = document.getElementById('navInfo');
    var input = document.getElementById('videoUrlInput');
    var playBtn = document.getElementById('playBtn');

    // 播放器地址（fpsgg.netlify.app）
    var PLAYER_URL = 'https://fpsgg.netlify.app/player.html';

    // ============================================================
    // 1. 渲染列表
    // ============================================================
    function renderList() {
        if (videoList.length === 0) {
            grid.innerHTML = `<div class="empty-hint"><i class="fas fa-video"></i> 暂无视频</div>`;
            navInfo.textContent = '0 个视频';
            return;
        }
        navInfo.textContent = videoList.length + ' 个视频';
        var html = '';
        videoList.forEach(function(url, index) {
            var num = index + 1;
            // 从 URL 中提取文件名作为显示名
            var name = url.split('/').pop().substring(0, 20) || '视频 ' + num;
            html += `
                <div class="video-card" data-url="${encodeURIComponent(url)}">
                    <div class="thumb">
                        <span class="play-icon"><i class="fas fa-play-circle"></i></span>
                        <span style="font-size:2rem;opacity:0.2;">🎬</span>
                    </div>
                    <div class="info">
                        <div class="name">${name}</div>
                        <div class="meta">视频 ${num}</div>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;

        // 点击卡片 → 跳转到播放器
        document.querySelectorAll('.video-card').forEach(function(card) {
            card.addEventListener('click', function() {
                var url = decodeURIComponent(this.dataset.url);
                playVideo(url);
            });
        });
    }

    // ============================================================
    // 2. 播放视频（跳转到 fpsgg.netlify.app）
    // ============================================================
    function playVideo(url) {
        if (!url || !url.trim()) {
            alert('请输入视频地址');
            return;
        }
        var encoded = encodeURIComponent(url.trim());
        window.location.href = PLAYER_URL + '?url=' + encoded;
    }

    // ============================================================
    // 3. 输入框播放
    // ============================================================
    playBtn.addEventListener('click', function() {
        var val = input.value.trim();
        if (!val) {
            alert('请输入视频地址');
            return;
        }
        playVideo(val);
    });

    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            playBtn.click();
        }
    });

    // ============================================================
    // 4. 支持蓝奏云链接自动解析（简单版）
    // ============================================================
    // 如果输入的是蓝奏云链接（包含 lanzou），自动转换为直链
    // 这里使用 lz0.qaiu.top 服务
    function parseLanzou(url) {
        // 如果已经是直链，直接返回
        if (url.includes('.mp4') || url.includes('.m3u8') || url.includes('.ts')) {
            return url;
        }
        // 蓝奏云链接 → 转换为直链
        // 格式：https://lz0.qaiu.top/d/lz/文件ID@密码
        // 简单处理：如果是蓝奏云链接，提示用户使用直链
        if (url.includes('lanzou')) {
            alert('检测到蓝奏云链接，请使用工具获取直链后粘贴，或使用 lz0.qaiu.top 格式：\nhttps://lz0.qaiu.top/d/lz/文件ID@密码');
            return null;
        }
        return url;
    }

    // 修改 playVideo 支持解析
    var originalPlay = playVideo;
    playVideo = function(url) {
        var parsed = parseLanzou(url);
        if (!parsed) return;
        if (!parsed.trim()) {
            alert('请输入视频地址');
            return;
        }
        var encoded = encodeURIComponent(parsed.trim());
        window.location.href = PLAYER_URL + '?url=' + encoded;
    };

    // 重新绑定
    playBtn.onclick = function() {
        var val = input.value.trim();
        if (!val) {
            alert('请输入视频地址');
            return;
        }
        playVideo(val);
    };

    input.onkeydown = function(e) {
        if (e.key === 'Enter') {
            playBtn.click();
        }
    };

    // ============================================================
    // 5. 启动
    // ============================================================
    renderList();
})();
</script>
</body>
</html>
