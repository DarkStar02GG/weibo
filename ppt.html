<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📊 演示文稿</title>
    <!-- 引入 PDF.js 核心库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.06);
            color: #c8d6e5;
            position: sticky;
            top: 1rem;
            z-index: 10;
            flex-wrap: wrap;
            gap: 6px;
        }
        .nav-bar .back-link {
            color: #8ba0c9;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 40px;
            transition: 0.2s;
        }
        .nav-bar .back-link:active { background: rgba(255,255,255,0.08); }
        .nav-bar .title {
            font-weight: 500;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-bar .title i { color: #ff9f43; }
        .nav-bar .page-info {
            font-size: 0.8rem;
            color: #5a7a9f;
        }

        #pdfContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            padding-bottom: 3rem;
        }
        #pdfContainer canvas {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            background: white;
            display: block;
        }
        .loading {
            text-align: center;
            padding: 4rem 1rem;
            color: #5a7a9f;
        }
        .loading i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 1rem;
            color: #ff9f43;
        }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: #ff6b6b;
        }
        .error-msg i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 1rem;
        }
        .error-msg .detail {
            font-size: 0.8rem;
            color: #5a7a9f;
            margin-top: 0.5rem;
            word-break: break-all;
        }
        @media (max-width: 480px) {
            body { padding: 0.5rem; }
            .nav-bar { padding: 0.5rem 0.8rem; margin-bottom: 1rem; }
            .nav-bar .title { font-size: 0.85rem; }
            #pdfContainer { gap: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-bar">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回</a>
        <span class="title"><i class="fas fa-file-pdf"></i> 演示文稿</span>
        <span class="page-info" id="pageInfo">加载中...</span>
    </div>
    <div id="pdfContainer">
        <div class="loading">
            <i class="fas fa-spinner spinner"></i>
            正在加载文档，请稍候...
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script>
    (function() {
        // ============================================================
        // ✅ 您的 PDF 下载直链
        // ============================================================
        var pdfUrl = 'https://pdf2.webgetstore.com/2026/08/09/12c85a0aa56c036fe5a0dbc1eb49d89d.pdf?sg=99f885745ff6f03106a2c6be6aae9c76&e=6a77e652&fileName=a16c913e96193f53bbf1bf5010eae04c.pdf&fi=306344382';
        // ============================================================

        var container = document.getElementById('pdfContainer');
        var pageInfo = document.getElementById('pageInfo');

        // 配置 PDF.js 工作线程
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // 禁用 PDF.js 的 CORS 限制（使用 CDN 代理）
        // 设置全局的 HTTP 头，允许跨域
        pdfjsLib.GlobalWorkerOptions.useSystemFonts = true;

        function renderAllPages(pdf) {
            var totalPages = pdf.numPages;
            pageInfo.textContent = '共 ' + totalPages + ' 页 · 下滑浏览';
            container.innerHTML = '';

            var loadedCount = 0;
            for (var pageNum = 1; pageNum <= totalPages; pageNum++) {
                (function(pageNumber) {
                    pdf.getPage(pageNumber).then(function(page) {
                        var scale = 1.5;
                        var viewport = page.getViewport({ scale: scale });
                        var canvas = document.createElement('canvas');
                        var context = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';

                        var renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };
                        page.render(renderContext).promise.then(function() {
                            container.appendChild(canvas);
                            loadedCount++;
                            if (loadedCount === totalPages) {
                                pageInfo.textContent = '✅ 共 ' + totalPages + ' 页 · 加载完成';
                            }
                        }).catch(function(err) {
                            console.warn('第 ' + pageNumber + ' 页渲染失败:', err);
                            var errorDiv = document.createElement('div');
                            errorDiv.style.cssText = 'padding:2rem;color:#ff6b6b;text-align:center;background:rgba(255,0,0,0.05);border-radius:12px;width:100%;';
                            errorDiv.textContent = '⚠️ 第 ' + pageNumber + ' 页加载失败';
                            container.appendChild(errorDiv);
                        });
                    }).catch(function(err) {
                        console.warn('获取第 ' + pageNumber + ' 页失败:', err);
                    });
                })(pageNum);
            }
        }

        // ============================================================
        // 使用 fetch + Blob 方式加载 PDF（绕过跨域限制）
        // ============================================================
        function loadPDFWithFetch() {
            pageInfo.textContent = '正在下载 PDF...';

            fetch(pdfUrl, {
                method: 'GET',
                mode: 'cors',  // 尝试跨域请求
                headers: {
                    'Accept': 'application/pdf'
                }
            })
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                }
                // 检查 Content-Type
                var contentType = response.headers.get('content-type');
                if (contentType && !contentType.includes('pdf') && !contentType.includes('octet-stream')) {
                    console.warn('Content-Type 不是 PDF:', contentType);
                }
                return response.arrayBuffer();
            })
            .then(function(arrayBuffer) {
                pageInfo.textContent = 'PDF 下载完成，正在解析...';
                // 使用 arrayBuffer 加载 PDF
                return pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            })
            .then(function(pdf) {
                renderAllPages(pdf);
            })
            .catch(function(err) {
                console.error('PDF 加载失败:', err);
                // 尝试直接用 URL 加载（备用方案）
                pageInfo.textContent = '尝试备用加载方式...';
                pdfjsLib.getDocument({ url: pdfUrl, withCredentials: false }).promise
                    .then(function(pdf) {
                        renderAllPages(pdf);
                    })
                    .catch(function(err2) {
                        console.error('备用加载也失败:', err2);
                        container.innerHTML = `
                            <div class="error-msg">
                                <i class="fas fa-exclamation-circle"></i>
                                <p>文档加载失败，请检查链接是否有效。</p>
                                <p class="detail">错误信息：${err2.message || err.message || '未知错误'}</p>
                                <p class="detail" style="margin-top:0.8rem;font-size:0.7rem;color:#4a6a8f;">
                                    💡 提示：PDF 直链可能有时效性，请重新获取最新链接
                                </p>
                            </div>
                        `;
                        pageInfo.textContent = '加载失败';
                    });
            });
        }

        // ============================================================
        // 启动加载
        // ============================================================
        loadPDFWithFetch();
    })();
</script>
</body>
</html>
